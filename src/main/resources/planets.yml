# Galaxy plugin — planet definitions.
# Sun at origin. Planets at varied orbital angles, sizes scaled larger.

planets:
  sun:
    world: planet_sun
    sphere:
      center: [0, 100, 0]
      radius: 28
      shell: SHROOMLIGHT
      core: GLOWSTONE
      skipBuild: true
    spawn:
      location: [0, 80, 0]
      yaw: 0.0
  mercury:
    world: planet_mercury
    sphere:
      center: [41, 100, 29]
      radius: 6
      shell: STONE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  venus:
    world: planet_venus
    sphere:
      center: [-31, 100, 85]
      radius: 11
      shell: ORANGE_TERRACOTTA
      core: MAGMA_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  earth:
    world: planet_earth
    sphere:
      center: [-132, 100, -48]
      radius: 14
      shell: BLUE_CONCRETE
      core: SEA_LANTERN
    spawn:
      location: [0, 81, 0]
      yaw: 0.0
  mars:
    world: planet_mars
    sphere:
      center: [34, 100, -192]
      radius: 8
      shell: RED_CONCRETE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  jupiter:
    world: planet_jupiter
    sphere:
      center: [180, 100, 214]
      radius: 22
      shell: ORANGE_TERRACOTTA
      core: BROWN_TERRACOTTA
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  saturn:
    world: planet_saturn
    sphere:
      center: [-235, 100, 280]
      radius: 18
      shell: SMOOTH_SANDSTONE
      core: SANDSTONE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  uranus:
    world: planet_uranus
    sphere:
      center: [-329, 100, -276]
      radius: 13
      shell: LIGHT_BLUE_CONCRETE
      core: BLUE_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  neptune:
    world: planet_neptune
    sphere:
      center: [315, 100, -375]
      radius: 13
      shell: BLUE_CONCRETE
      core: PACKED_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
