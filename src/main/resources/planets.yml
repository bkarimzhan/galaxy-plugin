# Galaxy plugin — planet definitions.
# Order matches the real solar system. All on +x axis, sun at (0,100,0).

planets:
  sun:
    world: planet_sun
    sphere:
      center: [0, 100, 0]
      radius: 18
      shell: SHROOMLIGHT
      core: GLOWSTONE
      skipBuild: true   # buildStar already constructs the visual sun
    spawn:
      location: [0, 80, 0]
      yaw: 0.0
  mercury:
    world: planet_mercury
    sphere:
      center: [30, 100, 0]
      radius: 4
      shell: STONE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  venus:
    world: planet_venus
    sphere:
      center: [55, 100, 0]
      radius: 7
      shell: ORANGE_TERRACOTTA
      core: MAGMA_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  earth:
    world: planet_earth
    sphere:
      center: [85, 100, 0]
      radius: 9
      shell: GREEN_CONCRETE
      core: SEA_LANTERN
    spawn:
      location: [0, 81, 0]
      yaw: 0.0
  mars:
    world: planet_mars
    sphere:
      center: [115, 100, 0]
      radius: 5
      shell: RED_CONCRETE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  jupiter:
    world: planet_jupiter
    sphere:
      center: [165, 100, 0]
      radius: 14
      shell: WHITE_TERRACOTTA
      core: ORANGE_TERRACOTTA
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  saturn:
    world: planet_saturn
    sphere:
      center: [220, 100, 0]
      radius: 12
      shell: SMOOTH_SANDSTONE
      core: SANDSTONE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  uranus:
    world: planet_uranus
    sphere:
      center: [265, 100, 0]
      radius: 8
      shell: PACKED_ICE
      core: BLUE_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  neptune:
    world: planet_neptune
    sphere:
      center: [310, 100, 0]
      radius: 8
      shell: BLUE_ICE
      core: PACKED_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
