# Galaxy plugin — planet definitions.
# Compact layout — entire system within 150-block "battle zone" from origin.
# Sun r=18 at centre, Neptune (outermost) edge at 147 blocks from origin.

planets:
  sun:
    world: planet_sun
    sphere:
      center: [0, 100, 0]
      radius: 18
      shell: SHROOMLIGHT
      core: GLOWSTONE
      skipBuild: true
    spawn:
      location: [0, 80, 0]
      yaw: 0.0
  mercury:
    world: planet_mercury
    sphere:
      center: [22, 100, 15]
      radius: 3
      shell: STONE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  venus:
    world: planet_venus
    sphere:
      center: [-13, 100, 36]
      radius: 5
      shell: ORANGE_TERRACOTTA
      core: MAGMA_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  earth:
    world: planet_earth
    sphere:
      center: [-49, 100, -18]
      radius: 6
      shell: GREEN_CONCRETE
      core: SEA_LANTERN
    spawn:
      location: [0, 81, 0]
      yaw: 0.0
  mars:
    world: planet_mars
    sphere:
      center: [11, 100, -64]
      radius: 3
      shell: RED_CONCRETE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  jupiter:
    world: planet_jupiter
    sphere:
      center: [55, 100, 65]
      radius: 8
      shell: ORANGE_TERRACOTTA
      core: BROWN_TERRACOTTA
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  saturn:
    world: planet_saturn
    sphere:
      center: [-67, 100, 80]
      radius: 7
      shell: SMOOTH_SANDSTONE
      core: SANDSTONE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  uranus:
    world: planet_uranus
    sphere:
      center: [-96, 100, -80]
      radius: 5
      shell: LIGHT_BLUE_CONCRETE
      core: BLUE_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  neptune:
    world: planet_neptune
    sphere:
      center: [91, 100, -109]
      radius: 5
      shell: BLUE_CONCRETE
      core: PACKED_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
