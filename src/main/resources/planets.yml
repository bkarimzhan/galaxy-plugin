# Galaxy plugin — planet definitions.
# Sun at origin. Planets distributed around it at real-life-proportional
# orbital radii but at varied angles (snapshot of an arbitrary moment).

planets:
  sun:
    world: planet_sun
    sphere:
      center: [0, 100, 0]
      radius: 18
      shell: ORANGE_CONCRETE
      core: YELLOW_CONCRETE
      skipBuild: true
    spawn:
      location: [0, 80, 0]
      yaw: 0.0
  mercury:
    world: planet_mercury
    sphere:
      center: [25, 100, 17]
      radius: 4
      shell: STONE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  venus:
    world: planet_venus
    sphere:
      center: [-19, 100, 52]
      radius: 7
      shell: ORANGE_TERRACOTTA
      core: MAGMA_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  earth:
    world: planet_earth
    sphere:
      center: [-80, 100, -29]
      radius: 9
      shell: GREEN_CONCRETE
      core: SEA_LANTERN
    spawn:
      location: [0, 81, 0]
      yaw: 0.0
  mars:
    world: planet_mars
    sphere:
      center: [20, 100, -113]
      radius: 5
      shell: RED_CONCRETE
      core: REDSTONE_BLOCK
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  jupiter:
    world: planet_jupiter
    sphere:
      center: [106, 100, 126]
      radius: 14
      shell: WHITE_TERRACOTTA
      core: ORANGE_TERRACOTTA
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  saturn:
    world: planet_saturn
    sphere:
      center: [-141, 100, 169]
      radius: 12
      shell: SMOOTH_SANDSTONE
      core: SANDSTONE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  uranus:
    world: planet_uranus
    sphere:
      center: [-203, 100, -170]
      radius: 8
      shell: PACKED_ICE
      core: BLUE_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
  neptune:
    world: planet_neptune
    sphere:
      center: [199, 100, -237]
      radius: 8
      shell: BLUE_ICE
      core: PACKED_ICE
    spawn:
      location: [0, 66, 0]
      yaw: 0.0
